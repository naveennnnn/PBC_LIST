<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Naveen — PCB Job List</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0f11;
    --bg2: #16181c;
    --bg3: #1e2026;
    --border: rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.12);
    --text: #f0f0f0;
    --text2: #9a9da6;
    --text3: #5a5d66;
    --accent: #4f8ef7;
    --accent2: #3a6fd4;
    --green: #34c97a;
    --amber: #f5a623;
    --red: #f05555;
    --t1: #f5c842;
    --t1bg: rgba(245,200,66,0.1);
    --t2: #4f8ef7;
    --t2bg: rgba(79,142,247,0.1);
    --t3: #34c97a;
    --t3bg: rgba(52,201,122,0.1);
    --perk-wlb: #a78bfa;
    --perk-wlb-bg: rgba(167,139,250,0.12);
    --perk-learn: #38bdf8;
    --perk-learn-bg: rgba(56,189,248,0.12);
    --perk-blr: #fb923c;
    --perk-blr-bg: rgba(251,146,60,0.12);
    --perk-food: #f472b6;
    --perk-food-bg: rgba(244,114,182,0.12);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    font-size: 14px;
    line-height: 1.6;
  }

  /* Header */
  .hero {
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    padding: 2rem 2.5rem 1.5rem;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .hero-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 1rem;
    margin-bottom: 1.25rem;
  }
  .hero-title h1 {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.4px;
    color: var(--text);
  }
  .hero-title p {
    font-size: 13px;
    color: var(--text2);
    margin-top: 3px;
  }
  .stats-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .stat {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 14px;
    font-size: 12px;
    color: var(--text2);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .stat strong { color: var(--text); font-weight: 500; }
  .stat .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent);
  }

  /* Controls */
  .controls {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }
  .search-wrap {
    position: relative;
    flex: 1;
    min-width: 200px;
    max-width: 300px;
  }
  .search-wrap svg {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    opacity: 0.35;
    pointer-events: none;
  }
  .search-input {
    width: 100%;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    padding: 7px 12px 7px 32px;
    outline: none;
    transition: border-color 0.2s;
  }
  .search-input:focus { border-color: var(--border2); }
  .search-input::placeholder { color: var(--text3); }
  .filter-btn {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text2);
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    font-weight: 500;
    padding: 7px 14px;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .filter-btn:hover { border-color: var(--border2); color: var(--text); }
  .filter-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .filter-btn.t1a { background: var(--t1bg); border-color: var(--t1); color: var(--t1); }
  .filter-btn.t2a { background: var(--t2bg); border-color: var(--t2); color: var(--t2); }
  .filter-btn.t3a { background: var(--t3bg); border-color: var(--t3); color: var(--t3); }

  /* Perk filter buttons */
  .perk-filters {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-top: 10px;
  }
  .perk-btn {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 20px;
    color: var(--text2);
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    font-weight: 500;
    padding: 5px 12px;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .perk-btn:hover { border-color: var(--border2); color: var(--text); }
  .perk-btn.active-wlb { background: var(--perk-wlb-bg); border-color: var(--perk-wlb); color: var(--perk-wlb); }
  .perk-btn.active-learn { background: var(--perk-learn-bg); border-color: var(--perk-learn); color: var(--perk-learn); }
  .perk-btn.active-blr { background: var(--perk-blr-bg); border-color: var(--perk-blr); color: var(--perk-blr); }
  .perk-btn.active-food { background: var(--perk-food-bg); border-color: var(--perk-food); color: var(--perk-food); }

  /* Bulk bar */
  .bulk-bar {
    margin: 1.5rem 2.5rem 0;
    background: linear-gradient(135deg, rgba(79,142,247,0.08), rgba(52,201,122,0.06));
    border: 1px solid rgba(79,142,247,0.2);
    border-radius: 12px;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  .bulk-bar-text { font-size: 13px; color: var(--text2); }
  .bulk-bar-text strong { color: var(--text); }
  .bulk-btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .bulk-link {
    text-decoration: none;
    font-size: 12px;
    font-weight: 500;
    padding: 6px 14px;
    border-radius: 8px;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    transition: opacity 0.15s;
    font-family: 'DM Sans', sans-serif;
  }
  .bulk-link:hover { opacity: 0.85; }
  .bulk-link.naukri { background: rgba(52,201,122,0.15); border: 1px solid rgba(52,201,122,0.3); color: var(--green); }
  .bulk-link.linkedin { background: rgba(79,142,247,0.15); border: 1px solid rgba(79,142,247,0.3); color: var(--accent); }

  /* Main content */
  .main { padding: 1.5rem 2.5rem 3rem; }

  /* Tier section */
  .tier-section { margin-bottom: 2rem; }
  .tier-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
  }
  .tier-tag {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    font-weight: 500;
    padding: 3px 10px;
    border-radius: 20px;
  }
  .tier-tag.t1 { background: var(--t1bg); color: var(--t1); border: 1px solid rgba(245,200,66,0.2); }
  .tier-tag.t2 { background: var(--t2bg); color: var(--t2); border: 1px solid rgba(79,142,247,0.2); }
  .tier-tag.t3 { background: var(--t3bg); color: var(--t3); border: 1px solid rgba(52,201,122,0.2); }
  .tier-header-text { font-size: 13px; color: var(--text2); }

  /* Company grid */
  .company-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 10px;
  }
  .company-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    transition: border-color 0.2s, background 0.2s;
    animation: fadeIn 0.3s ease both;
  }
  .company-card:hover {
    border-color: var(--border2);
    background: var(--bg3);
  }
  .co-top {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: none; }
  }
  .co-initial {
    width: 36px; height: 36px;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 600;
    flex-shrink: 0;
    font-family: 'DM Mono', monospace;
  }
  .co-initial.t1 { background: var(--t1bg); color: var(--t1); }
  .co-initial.t2 { background: var(--t2bg); color: var(--t2); }
  .co-initial.t3 { background: var(--t3bg); color: var(--t3); }
  .co-info { flex: 1; min-width: 0; }
  .co-name {
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .co-perks {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
    margin-top: 4px;
  }
  .perk-tag {
    font-size: 10px;
    font-weight: 500;
    padding: 2px 7px;
    border-radius: 10px;
    white-space: nowrap;
    border: 1px solid transparent;
  }
  .perk-wlb { background: var(--perk-wlb-bg); color: var(--perk-wlb); }
  .perk-learn { background: var(--perk-learn-bg); color: var(--perk-learn); }
  .perk-blr { background: var(--perk-blr-bg); color: var(--perk-blr); }
  .perk-food { background: var(--perk-food-bg); color: var(--perk-food); }
  .co-links { display: flex; gap: 5px; flex-wrap: wrap; }
  .co-link {
    text-decoration: none;
    font-size: 11px;
    font-weight: 500;
    padding: 4px 9px;
    border-radius: 6px;
    transition: opacity 0.15s, transform 0.1s;
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
    gap: 3px;
    font-family: 'DM Sans', sans-serif;
  }
  .co-link:hover { opacity: 0.8; transform: translateY(-1px); }
  .co-link.naukri { background: var(--t3bg); color: var(--green); border: 1px solid rgba(52,201,122,0.2); }
  .co-link.linkedin { background: var(--t2bg); color: var(--accent); border: 1px solid rgba(79,142,247,0.2); }
  .co-link.careers { background: var(--bg3); color: var(--text2); border: 1px solid var(--border); }

  /* Empty state */
  .empty {
    text-align: center;
    padding: 4rem 1rem;
    color: var(--text3);
  }
  .empty p { margin-top: 8px; font-size: 13px; }

  /* Footer */
  footer {
    text-align: center;
    padding: 1.5rem;
    font-size: 12px;
    color: var(--text3);
    border-top: 1px solid var(--border);
  }

  @media (max-width: 640px) {
    .hero, .main { padding-left: 1.25rem; padding-right: 1.25rem; }
    .bulk-bar { margin-left: 1.25rem; margin-right: 1.25rem; }
    .co-links { flex-direction: column; }
    .hero-top { flex-direction: column; }
  }
</style>
</head>

  {name:"MakeMyTrip",tier:"t3",perks:["wlb","learn","blr","food"],slug:"makemytrip",li:"MakeMyTrip",careers:"https://careers.makemytrip.com/"},
  {name:"Western Digital",tier:"t3",perks:["wlb","learn","blr","food"],slug:"western-digital",li:"Western+Digital",careers:"https://www.westerndigital.com/careers"},
  {name:"Seagate",tier:"t3",perks:["wlb","learn","blr","food"],slug:"seagate",li:"Seagate",careers:"https://www.seagate.com/in/en/jobs/"},
  {name:"Micron",tier:"t3",perks:["wlb","learn","blr","food"],slug:"micron",li:"Micron+Technology",careers:"https://careers.micron.com/"},
];

const TIER_META = {
  t1: { label: "Tier 1", cls: "t1", desc: "Excellent WLB · Excellent Learning — apply first" },
  t2: { label: "Tier 2", cls: "t2", desc: "One Excellent, one Good — strong overall balance" },
  t3: { label: "Tier 3", cls: "t3", desc: "Good WLB · Good Learning — solid and worth trying" },
};

const PERK_LABELS = {
  wlb:   { emoji: "⚖️", label: "WLB",       cls: "wlb" },
  learn:  { emoji: "📚", label: "Learning",   cls: "learn" },
  blr:   { emoji: "📍", label: "Bangalore",  cls: "blr" },
  food:  { emoji: "🍕", label: "Food",       cls: "food" },
};

const QUALITY = {
  t1: { wlb: "Excellent", learn: "Excellent" },
  t2: { wlb: "Excellent", learn: "Good" },
  t3: { wlb: "Good", learn: "Good" },
};

let activeFilter = 'all';
let activePerk = null;

// Update stat counts
function updateCounts() {
  const t1 = COMPANIES.filter(c => c.tier === 't1').length;
  const t2 = COMPANIES.filter(c => c.tier === 't2').length;
  const t3 = COMPANIES.filter(c => c.tier === 't3').length;
  document.getElementById('count-t1').textContent = t1;
  document.getElementById('count-t2').textContent = t2;
  document.getElementById('count-t3').textContent = t3;
  document.getElementById('count-total').textContent = `${t1 + t2 + t3} companies`;
  document.getElementById('footer').innerHTML =
    `Built for Naveen &nbsp;·&nbsp; ${t1+t2+t3} WLB targets in Bangalore &nbsp;·&nbsp; Java Developer 2026`;
}

function setFilter(f) {
  activeFilter = f;
  ['all','t1','t2','t3'].forEach(k => {
    const b = document.getElementById('btn-'+k);
    b.className = 'filter-btn';
    if (k === f) b.className += k === 'all' ? ' active' : ` ${k}a`;
  });
  render();
}

function togglePerk(p) {
  activePerk = activePerk === p ? null : p;
  ['wlb','learn','blr','food'].forEach(k => {
    const b = document.getElementById('perk-'+k);
    b.className = 'perk-btn';
    if (k === activePerk) b.className += ` active-${k}`;
  });
  render();
}

function naukri(c) {
  return `https://www.naukri.com/java-developer-jobs-in-${c.slug}?experience=1,3`;
}
function linkedin(c) {
  return `https://www.linkedin.com/jobs/search/?keywords=Java+Developer+${c.li}&location=Bengaluru%2C+Karnataka&f_E=2%2C3`;
}

function initials(name) {
  return name.split(' ').slice(0, 2).map(w => w[0]).join('').toUpperCase();
}

function perkTags(perks, tier) {
  return perks.map(p => {
    const info = PERK_LABELS[p];
    const q = QUALITY[tier];
    let qualityLabel = '';
    if (p === 'wlb' && q) qualityLabel = ` · ${q.wlb}`;
    if (p === 'learn' && q) qualityLabel = ` · ${q.learn}`;
    return `<span class="perk-tag perk-${info.cls}">${info.emoji} ${info.label}${qualityLabel}</span>`;
  }).join('');
}

function render() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  const main = document.getElementById('main');

  const filtered = COMPANIES.filter(c => {
    const tierOk = activeFilter === 'all' || c.tier === activeFilter;
    const nameOk = !q || c.name.toLowerCase().includes(q);
    const perkOk = !activePerk || c.perks.includes(activePerk);
    return tierOk && nameOk && perkOk;
  });

  if (!filtered.length) {
    main.innerHTML = `<div class="empty"><p style="font-size:32px">🔍</p><p>No companies match your search.</p></div>`;
    return;
  }

  const linkIcon = `<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>`;

  const tiers = ['t1', 't2', 't3'];
  let html = '';

  tiers.forEach(tier => {
    const group = filtered.filter(c => c.tier === tier);
    if (!group.length) return;
    const meta = TIER_META[tier];
    html += `
      <div class="tier-section" id="section-${tier}">
        <div class="tier-header">
          <span class="tier-tag ${meta.cls}">${meta.label}</span>
          <span class="tier-header-text">${meta.desc} &nbsp;·&nbsp; ${group.length} companies</span>
        </div>
        <div class="company-grid">
          ${group.map((c, i) => `
            <div class="company-card" style="animation-delay:${i * 0.03}s">
              <div class="co-top">
                <div class="co-initial ${c.tier}">${initials(c.name)}</div>
                <div class="co-info">
                  <div class="co-name">${c.name}</div>
                  <div class="co-perks">${perkTags(c.perks, c.tier)}</div>
                </div>
              </div>
              <div class="co-links">
                <a class="co-link naukri" href="${naukri(c)}" target="_blank">${linkIcon} Naukri</a>
                <a class="co-link linkedin" href="${linkedin(c)}" target="_blank">${linkIcon} LinkedIn</a>
                <a class="co-link careers" href="${c.careers}" target="_blank">${linkIcon} Careers</a>
              </div>
            </div>
          `).join('')}
        </div>
      </div>`;
  });

  main.innerHTML = html;
}

updateCounts();
render();
</script>
</body>
</html>
